[build]
  base      = "frontend"
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  VITE_API_URL = "https://car-service-backend-56g8.onrender.com"
  NODE_VERSION = "18"

# ── API proxy — forward all /api/* to the Render backend ──────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://car-service-backend-56g8.onrender.com/api/:splat"
  status = 200
  force  = true

# ── Health check proxy ────────────────────────────────────────────────────
[[redirects]]
  from   = "/health"
  to     = "https://car-service-backend-56g8.onrender.com/health"
  status = 200
  force  = true

# ── SPA fallback — must be LAST ───────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
